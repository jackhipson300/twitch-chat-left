name: Release

on:
  push:
    paths:
      - "extension/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only release from the default branch, whatever it is called.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp version
        id: version
        run: echo "version=$(node scripts/release-prep.mjs version ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
      - name: Lint
        run: npx web-ext lint --source-dir extension --self-hosted
      - name: Sign with Mozilla (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >
          npx web-ext sign
          --source-dir extension
          --artifacts-dir dist
          --channel unlisted
          --approval-timeout 900000
      - name: Build release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xpi="twitch-chat-left-$VERSION.xpi"
          mv dist/*.xpi "dist/$xpi"
          node scripts/release-prep.mjs updates "$VERSION" \
            "https://github.com/${{ github.repository }}/releases/download/v$VERSION/$xpi" \
            dist/updates.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.xpi dist/updates.json \
            --title "v$VERSION" \
            --notes "Signed build of ${GITHUB_SHA::7}. Installed copies update automatically." \
            --latest
